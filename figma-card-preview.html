<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>火车信息卡片 - Figma 精确还原</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #f0f4f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      padding: 40px;
    }
    .title {
      font-size: 14px;
      color: #666;
      margin-bottom: 20px;
    }

    /* ===== Frame 11 - 最外层容器 ===== */
    .Frame-11 {
      position: relative;
      width: 210px;
      height: 109px;
    }

    /* ===== 服务标签 ===== */
    .Frame-6, .Frame-7, .Frame-8, .Frame-9, .Frame-10 {
      position: absolute;
      width: 24px;
      height: 24px;
      top: 0;
    }
    .Frame-6 { left: 181px; }
    .Frame-7 { left: 154px; }
    .Frame-8 { left: 127px; }
    .Frame-9 { left: 100px; }
    .Frame-10 { left: 73px; }
    
    .service-text {
      position: absolute;
      left: 5px;
      top: 3px;
      font-size: 14px;
      font-weight: 700;
      color: #000000;
    }

    /* ===== Frame 1 - 主内容区 ===== */
    .Frame-1 {
      position: absolute;
      top: 25px;
      left: 0;
      width: 210px;
    }

    /* ===== Frame 2 - 车次标签 ===== */
    .Frame-2 {
      position: absolute;
      top: 5px;
      left: 44px;
      width: 88px;
      height: 28px;
    }
    .train-number {
      position: absolute;
      left: 25.5px;
      top: 5px;
      font-size: 16px;
      font-weight: 700;
      color: #D48806;
    }

    /* ===== 路线文字 ===== */
    .route-text {
      position: absolute;
      top: 35px;
      left: 19px;
      font-size: 13px;
      font-weight: 400;
      color: #3D3B3B;
    }

    /* ===== Frame 4 - 股道框 ===== */
    .Frame-4 {
      position: absolute;
      top: 5px;
      left: 139px;
      width: 65px;
      height: 44px;
    }
    .track-text {
      position: absolute;
      left: 7px;
      top: 6px;
      font-size: 16px;
      font-weight: 700;
      color: #2E3237;
    }
    .Rectangle-5 {
      position: absolute;
      left: 10px;
      top: 29px;
      width: 46px;
      height: 9px;
    }

    /* ===== Frame 5 - 时间框 ===== */
    .Frame-5 {
      position: absolute;
      top: 56px;
      left: 44px;
      width: 88px;
      height: 24px;
    }
    .time-text {
      position: absolute;
      left: -18px;
      top: 3px;
      width: 88px;
      font-size: 14px;
      font-weight: 700;
      color: #2E3237;
      text-align: center;
    }

    /* ===== Frame 3 - 变道框 ===== */
    .Frame-3 {
      position: absolute;
      top: 56px;
      left: 139px;
      width: 66px;
      height: 24px;
    }
    .track-change-text {
      position: absolute;
      left: 8px;
      top: 3px;
      font-size: 14px;
      font-weight: 700;
      color: #FFF0F1;
    }
  </style>
</head>
<body>
  <div class="title">Figma 设计还原 — 火车信息卡片</div>
  
  <!-- Frame 11 - 最外层容器 -->
  <div class="Frame-11">
    <!-- 服务标签 - 使用 SVG -->
    <div class="Frame-6">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="0.5" y="0.5" width="23" height="23" rx="4.5" fill="#C5F6FF" stroke="#627C94"/>
      </svg>
      <span class="service-text">水</span>
    </div>
    <div class="Frame-7">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="0.5" y="0.5" width="23" height="23" rx="4.5" fill="#C5F6FF" stroke="#627C94"/>
      </svg>
      <span class="service-text">污</span>
    </div>
    <div class="Frame-8">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="0.5" y="0.5" width="23" height="23" rx="4.5" fill="#C5F6FF" stroke="#627C94"/>
      </svg>
      <span class="service-text">包</span>
    </div>
    <div class="Frame-9">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="0.5" y="0.5" width="23" height="23" rx="4.5" fill="#C5F6FF" stroke="#627C94"/>
      </svg>
      <span class="service-text">餐</span>
    </div>
    <div class="Frame-10">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="0.5" y="0.5" width="23" height="23" rx="4.5" fill="#C5F6FF" stroke="#627C94"/>
      </svg>
      <span class="service-text">库</span>
    </div>

    <!-- Frame 1 - 主内容区 -->
    <div class="Frame-1">
      <!-- 顶部背景 SVG -->
      <svg width="210" height="52" viewBox="0 0 210 52" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M68.2734 0.5H201C205.694 0.5 209.5 4.30558 209.5 9V51.5H0.5V47.749C0.500054 43.6368 2.37458 39.7488 5.5918 37.1875L38.6885 10.8389C47.0965 4.14507 57.5262 0.500031 68.2734 0.5Z" fill="url(#paint0_linear)" stroke="#60BDE6"/>
        <defs>
          <linearGradient id="paint0_linear" x1="105" y1="0" x2="105" y2="52" gradientUnits="userSpaceOnUse">
            <stop stop-color="#E3F7FF"/>
            <stop offset="1" stop-color="#60BDE6"/>
          </linearGradient>
        </defs>
      </svg>
      
      <!-- 底部背景 SVG -->
      <svg width="210" height="32" viewBox="0 0 210 32" fill="none" xmlns="http://www.w3.org/2000/svg" style="position:absolute;top:52px;left:0;">
        <path d="M0 0H210V23C210 27.9706 205.971 32 201 32H9.00001C4.02944 32 0 27.9706 0 23V0Z" fill="#D9D9D9"/>
        <path d="M209.5 0.5V23C209.5 27.6944 205.694 31.5 201 31.5H9C4.30558 31.5 0.5 27.6944 0.5 23V0.5H209.5Z" stroke="#051A36" stroke-opacity="0.34"/>
      </svg>

      <!-- 车次标签 - 使用 SVG -->
      <div class="Frame-2">
        <svg width="88" height="28" viewBox="0 0 88 28" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.4004 0.5H82C85.0376 0.5 87.5 2.96243 87.5 6V22C87.5 25.0376 85.0376 27.5 82 27.5H5.59961C2.78327 27.4998 0.500211 25.2167 0.5 22.4004C0.5 10.3054 10.3054 0.5 22.4004 0.5Z" fill="url(#paint1_linear)" stroke="#D48806"/>
          <defs>
            <linearGradient id="paint1_linear" x1="0" y1="14" x2="88" y2="14" gradientUnits="userSpaceOnUse">
              <stop stop-color="#ECE6DA"/>
              <stop offset="1" stop-color="#FFD18F"/>
            </linearGradient>
          </defs>
        </svg>
        <span class="train-number">G1101</span>
      </div>

      <!-- 路线 -->
      <span class="route-text">重庆东→北京西</span>

      <!-- 股道信息 - 使用 SVG -->
      <div class="Frame-4">
        <svg width="65" height="44" viewBox="0 0 65 44" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="0.5" y="0.5" width="64" height="43" rx="8.5" fill="url(#paint2_linear)" stroke="#4B4F52"/>
          <defs>
            <linearGradient id="paint2_linear" x1="32.5" y1="0" x2="32.5" y2="44" gradientUnits="userSpaceOnUse">
              <stop stop-color="#D9D9D9"/>
              <stop offset="1" stop-color="#737373"/>
            </linearGradient>
          </defs>
        </svg>
        <span class="track-text">16正北</span>
        <svg class="Rectangle-5" viewBox="0 0 46 9" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="0.5" y="0.5" width="45" height="8" rx="4" fill="#00FF2F" stroke="#413F3F"/>
        </svg>
      </div>

      <!-- 时间 - 使用 SVG -->
      <div class="Frame-5">
        <svg width="124" height="24" viewBox="0 0 124 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="position:absolute;left:-36px;top:0;">
          <rect x="0.5" y="0.5" width="123" height="23" rx="8.5" fill="url(#paint3_linear)" stroke="#7D7979"/>
          <defs>
            <linearGradient id="paint3_linear" x1="62" y1="0" x2="62" y2="24" gradientUnits="userSpaceOnUse">
              <stop stop-color="#D9D9D9"/>
              <stop offset="1" stop-color="#737373" stop-opacity="0.86"/>
            </linearGradient>
          </defs>
        </svg>
        <span class="time-text">08:19</span>
      </div>

      <!-- 变道 - 使用 SVG -->
      <div class="Frame-3">
        <svg width="66" height="24" viewBox="0 0 66 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="0.5" y="0.5" width="65" height="23" rx="8.5" fill="url(#paint4_linear)" stroke="#7D7979"/>
          <defs>
            <linearGradient id="paint4_linear" x1="33" y1="0" x2="33" y2="24" gradientUnits="userSpaceOnUse">
              <stop stop-color="#E60000"/>
              <stop offset="1" stop-color="#800000"/>
            </linearGradient>
          </defs>
        </svg>
        <span class="track-change-text">25→24</span>
      </div>
    </div>
  </div>
</body>
</html>
