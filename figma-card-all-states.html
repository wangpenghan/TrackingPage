<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>火车信息卡片 - 四种状态</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #f0f4f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      padding: 40px;
      gap: 40px;
    }
    .title {
      font-size: 14px;
      color: #666;
      margin-bottom: 10px;
    }
    .state-row {
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .state-label {
      text-align: center;
      font-size: 12px;
      color: #666;
      margin-bottom: 10px;
    }

    /* ===== 通用卡片样式 ===== */
    .card {
      position: relative;
      width: 210px;
      height: 109px;
    }

    /* 服务标签 */
    .service-tag {
      position: absolute;
      width: 24px;
      height: 24px;
      top: 0;
    }
    .service-tag:nth-child(1) { left: 181px; }
    .service-tag:nth-child(2) { left: 154px; }
    .service-tag:nth-child(3) { left: 127px; }
    .service-tag:nth-child(4) { left: 100px; }
    .service-tag:nth-child(5) { left: 73px; }
    
    .service-text {
      position: absolute;
      left: 5px;
      top: 3px;
      font-size: 14px;
      font-weight: 700;
      color: #000000;
    }

    /* 主内容区 */
    .main-content {
      position: absolute;
      top: 25px;
      left: 0;
      width: 210px;
    }

    /* 车次标签 */
    .train-label {
      position: absolute;
      top: 5px;
      width: 88px;
      height: 28px;
    }
    .train-label.left { left: 44px; }
    .train-label.right { left: 78px; }
    .train-text {
      position: absolute;
      top: 5px;
      font-size: 16px;
      font-weight: 700;
      color: #D48806;
    }
    .train-text.left { left: 25.5px; }
    .train-text.right { left: 15.5px; }

    /* 路线 */
    .route-text {
      position: absolute;
      font-size: 13px;
      font-weight: 400;
      color: #3D3B3B;
    }
    .route-text.left { left: 19px; top: 35px; }
    .route-text.right { left: 78px; top: 35px; }

    /* 股道框 */
    .track-box {
      position: absolute;
      width: 65px;
      height: 44px;
    }
    .track-box.left { left: 139px; top: 5px; }
    .track-box.right { left: 6px; top: 5px; }
    .track-text {
      position: absolute;
      left: 7px;
      top: 6px;
      font-size: 16px;
      font-weight: 700;
      color: #2E3237;
    }

    /* 时间框 */
    .time-box {
      position: absolute;
      width: 124px;
      height: 24px;
    }
    .time-box.left { left: 8px; top: 56px; }
    .time-box.right { left: 0px; top: 56px; }
    .time-text {
      position: absolute;
      top: 3px;
      width: 88px;
      font-size: 14px;
      font-weight: 700;
      color: #2E3237;
      text-align: center;
    }
    .time-text.left { left: -18px; }
    .time-text.right { left: 18px; }

    /* 变道框 */
    .change-box {
      position: absolute;
      width: 66px;
      height: 24px;
    }
    .change-box.left { left: 139px; top: 56px; }
    .change-box.right { left: 5px; top: 56px; }
    .change-text {
      position: absolute;
      left: 8px;
      top: 3px;
      font-size: 14px;
      font-weight: 700;
      color: #FFF0F1;
    }

    /* 晚点分钟数圆圈 */
    .delay-circle {
      position: absolute;
      top: 13px;
      left: 0;
      width: 40px;
      height: 40px;
    }
    .delay-text {
      position: absolute;
      left: 10px;
      top: 13px;
      font-size: 14px;
      font-weight: 700;
      color: #000000;
    }
  </style>
</head>
