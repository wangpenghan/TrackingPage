<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>车次卡片 精确复刻</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #e8e8eb;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  gap: 60px;
  font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
}

.label {
  font-size: 13px;
  color: #475569;
  font-weight: 600;
}

.train-card-wrap {
  position: relative;
  padding-top: 26px;
}

.top-tags {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  display: flex;
  justify-content: flex-end;
  gap: 5px;
  z-index: 20;
}

.top-tag {
  width: 30px;
  height: 22px;
  background: rgb(200, 230, 235);
  border: 2px solid rgb(0, 170, 170);
  border-radius: 4px;
  color: rgb(0, 100, 100);
  font-size: 11px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 卡片主体 */
.card-main {
  width: 240px;
  height: 110px;
  position: relative;
  /* 完全透明背景 */
  background: transparent;
  /* 不使用任何裁剪或圆角 */
  border-radius: 0;
  overflow: visible;
  /* 阴影通过 SVG 内部元素或 filter 添加 */
  box-shadow: none;
}

/* SVG背景层：包含蓝色车头弧形区域 + 底部灰色区域 */
.card-bg-svg {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
  border-bottom-right-radius: 10px;
  /* 使用 filter 给整个 SVG 添加贴合形状的阴影 */
  filter: drop-shadow(4px 4px 14px rgba(0,0,0,0.2)) drop-shadow(1px 1px 4px rgba(0,0,0,0.1));
}

/* 车次号框 */
.train-no-box {
  position: absolute;
  left: 45px;
  top: 8px;
  background: linear-gradient(180deg, rgb(237, 236, 198) 0%, rgb(221, 228, 195) 100%);
  border: 2px solid rgb(180, 120, 15);
  border-radius: 6px;
  padding: 4px 12px;
  z-index: 10;
}

.train-no-text {
  font-size: 22px;
  font-weight: 900;
  color: rgb(140, 80, 0);
  letter-spacing: 1.5px;
  line-height: 1.1;
}

/* 路线文字 */
.route-line {
  position: absolute;
  left: 30px;
  top: 50px;
  font-size: 12px;
  font-weight: 700;
  color: #1e293b;
  z-index: 10;
}

/* 方向框 */
.direction-box {
  position: absolute;
  right: 8px;
  top: 8px;
  width: 65px;
  height: 52px;
  background: linear-gradient(180deg, rgb(215, 215, 215) 0%, rgb(195, 195, 195) 100%);
  border: 2px solid rgb(155, 155, 155);
  border-radius: 7px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 10;
  gap: 3px;
}

.direction-text {
  font-size: 14px;
  font-weight: 900;
  color: #1f2937;
  line-height: 1;
}

.direction-bar {
  width: 80%;
  height: 10px;
  background: rgb(0, 147, 230);
  border-radius: 3px;
  margin-top: 1px;
}

/* 底部内容层 */
.card-bottom {
  position: absolute;
  left: 0;
  bottom: 0;
  width: 100%;
  height: 35%;
  z-index: 5;
  display: flex;
  align-items: center;
  padding: 0 6px;
  gap: 8px;
}

.time-box {
  flex: 1;
  height: 80%;
  background: rgb(230, 230, 230);
  border: 2px solid rgb(200, 200, 200);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.time-val {
  font-size: 15px;
  font-weight: 800;
  color: #1e293b;
  letter-spacing: 0.3px;
}

.platform-box {
  width: 70px;
  height: 80%;
  background: rgb(217, 2, 29);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.platform-val {
  font-size: 16px;
  font-weight: 900;
  color: white;
  letter-spacing: 0.5px;
}

.scale-2x {
  transform: scale(2);
  transform-origin: top center;
  margin-bottom: 150px;
}
</style>
</head>
<body>

<div class="label">原始尺寸 240×136px（含顶部标签）</div>

<div class="train-card-wrap">
  <div class="top-tags">
    <div class="top-tag">库</div>
    <div class="top-tag">餐</div>
    <div class="top-tag">包</div>
    <div class="top-tag">污</div>
    <div class="top-tag">水</div>
  </div>

  <div class="card-main">
    <!--
      SVG背景：
      - 蓝色区域：左上角是高铁车头弧形（从x=51,y=0开始向左弯曲到x=0,y=68）
      - 底部灰色区域：y=71以下
      - 分隔线：y=71处
      viewBox: 0 0 240 110
    -->
    <svg class="card-bg-svg" viewBox="0 0 240 110" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="blueGrad1" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="rgb(210,240,252)"/>
          <stop offset="100%" stop-color="rgb(150,210,238)"/>
        </linearGradient>
        <linearGradient id="grayGrad1" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="rgb(248,248,248)"/>
          <stop offset="100%" stop-color="rgb(238,238,238)"/>
        </linearGradient>
      </defs>
      <!-- 蓝色上半部分：弧形左上角，右下圆角 -->
      <path d="M 240,0 L 100,0 C 50,0 0,20 0,68 L 0,71 L 230,71 C 240,71 240,71 240,81 L 240,110 L 240,110 L 240,0 Z" fill="url(#blueGrad1)"/>
      <!-- 灰色下半部分：与蓝色区域平滑衔接，左下跟随弧形，右下圆角 -->
      <path d="M 230,71 L 100,71 C 50,71 0,71 0,68 L 0,110 L 240,110 L 240,81 C 240,71 240,71 230,71 Z" fill="url(#grayGrad1)"/>
      <!-- 分隔线：平滑的弧形分隔线，右侧圆角 -->
      <path d="M 230,71 L 100,71 C 50,71 0,71 0,68" stroke="rgb(195,195,195)" stroke-width="1.5" fill="none"/>
    </svg>

    <div class="train-no-box">
      <span class="train-no-text">G1001</span>
    </div>

    <div class="route-line">重庆东 → 北京西</div>

    <div class="direction-box">
      <div class="direction-text">16正北</div>
      <div class="direction-bar"></div>
    </div>

    <div class="card-bottom">
      <div class="time-box">
        <span class="time-val">08:19/08:35</span>
      </div>
      <div class="platform-box">
        <span class="platform-val">6→12</span>
      </div>
    </div>
  </div>
</div>

<div class="label">放大 2x 查看细节</div>

<div class="scale-2x">
  <div class="train-card-wrap">
    <div class="top-tags">
      <div class="top-tag">库</div>
      <div class="top-tag">餐</div>
      <div class="top-tag">包</div>
      <div class="top-tag">污</div>
      <div class="top-tag">水</div>
    </div>
    <div class="card-main">
      <svg class="card-bg-svg" viewBox="0 0 240 110" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="blueGrad2" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="rgb(210,240,252)"/>
            <stop offset="100%" stop-color="rgb(150,210,238)"/>
          </linearGradient>
          <linearGradient id="grayGrad2" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="rgb(248,248,248)"/>
            <stop offset="100%" stop-color="rgb(238,238,238)"/>
          </linearGradient>
        </defs>
        <path d="M 240,0 L 100,0 C 50,0 0,20 0,68 L 0,71 L 230,71 C 240,71 240,71 240,81 L 240,110 L 240,110 L 240,0 Z" fill="url(#blueGrad2)"/>
        <path d="M 230,71 L 100,71 C 50,71 0,71 0,68 L 0,110 L 240,110 L 240,81 C 240,71 240,71 230,71 Z" fill="url(#grayGrad2)"/>
        <path d="M 230,71 L 100,71 C 50,71 0,71 0,68" stroke="rgb(195,195,195)" stroke-width="1.5" fill="none"/>
      </svg>
      <div class="train-no-box">
        <span class="train-no-text">G1001</span>
      </div>
      <div class="route-line">重庆东 → 北京西</div>
      <div class="direction-box">
        <div class="direction-text">16正北</div>
        <div class="direction-bar"></div>
      </div>
      <div class="card-bottom">
        <div class="time-box">
          <span class="time-val">08:19/08:35</span>
        </div>
        <div class="platform-box">
          <span class="platform-val">6→12</span>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
